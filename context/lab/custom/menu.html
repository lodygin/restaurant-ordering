<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menu · My Kitchen (mockup)</title>
    <link rel="stylesheet" href="custom.css" />
    <link rel="stylesheet" href="../shared/lab-panel.css" />
    <style>
      .menu-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 32px;
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 24px 80px;
      }

      .menu-tools {
        position: sticky;
        top: 60px;
        z-index: 10;
        display: grid;
        gap: 12px;
        padding: 20px 0 12px;
        background: var(--bg);
      }

      .menu-tools .field {
        height: 44px;
        font-size: 16px;
      }

      /* Registered so the fade widths can transition instead of snapping. */
      @property --fade-start {
        syntax: '<length>';
        inherits: false;
        initial-value: 0px;
      }

      @property --fade-end {
        syntax: '<length>';
        inherits: false;
        initial-value: 0px;
      }

      .chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
        mask-image: linear-gradient(
          to right,
          transparent,
          #000 var(--fade-start),
          #000 calc(100% - var(--fade-end)),
          transparent
        );
        transition:
          --fade-start 0.2s,
          --fade-end 0.2s;
      }

      .chips[data-fade-start] {
        --fade-start: 48px;
      }

      .chips[data-fade-end] {
        --fade-end: 48px;
      }

      .chips a {
        flex: none;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }

      .chips a[aria-current='true'] {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }

      .cat {
        scroll-margin-top: 170px;
      }

      .cat h2 {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 28px 0 10px;
        font-size: 26px;
        letter-spacing: -0.01em;
      }

      .cat h2 small {
        font: 500 14px var(--font-body);
        color: var(--muted);
      }

      .rows {
        list-style: none;
        margin: 0;
        padding: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-m);
        overflow: hidden;
      }

      /* Fixed row height: the real app virtualises this list, so rows must not grow. */
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto 128px;
        align-items: center;
        gap: 16px;
        height: var(--row-h);
        padding: 0 16px;
        border-top: 1px solid var(--line);
        content-visibility: auto;
        contain-intrinsic-size: auto var(--row-h);
      }

      .row:first-child {
        border-top: 0;
      }

      .row-name {
        display: block;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .row-desc {
        display: block;
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .row-price {
        font-weight: 600;
        text-align: right;
      }

      .row-price.open {
        font-weight: 500;
        font-size: 13px;
        color: var(--muted);
      }

      .row-action {
        display: flex;
        justify-content: flex-end;
      }

      .row[data-soldout] .row-name,
      .row[data-soldout] .row-price {
        color: var(--muted);
      }

      .row[data-soldout] .row-price {
        text-decoration: line-through;
      }

      .row.changed {
        animation: changed 2.4s ease-out;
      }

      @keyframes changed {
        0%,
        40% {
          background: var(--flag-soft);
        }
        100% {
          background: var(--surface);
        }
      }

      .empty-search {
        padding: 48px 0;
        color: var(--muted);
      }

      /* ---------- Cart ---------- */

      .cart {
        position: sticky;
        top: 84px;
        align-self: start;
        margin-top: 20px;
        max-height: calc(100vh - 104px);
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-m);
      }

      .cart-head {
        padding: 18px 20px 12px;
        border-bottom: 1px solid var(--line);
      }

      .cart-head h2 {
        font-size: 22px;
      }

      .cart-lines {
        flex: 1;
        overflow-y: auto;
        list-style: none;
        margin: 0;
        padding: 0 20px;
      }

      .line {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px 12px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }

      .line-name {
        font-weight: 600;
      }

      .line-unit {
        font-size: 13px;
        color: var(--muted);
      }

      .line-total {
        font-weight: 600;
        text-align: right;
      }

      .line-controls {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .line .stepper {
        height: 30px;
      }

      .line .stepper button {
        width: 28px;
      }

      .line-warning {
        grid-column: 1 / -1;
        padding: 6px 10px;
        border-radius: var(--radius-s);
        background: var(--flag-soft);
        font-size: 13px;
      }

      .line-warning.gone {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .cart-empty {
        padding: 32px 20px;
        color: var(--muted);
      }

      .cart-foot {
        display: grid;
        gap: 12px;
        padding: 16px 20px 20px;
        border-top: 1px solid var(--line);
      }

      .discount {
        display: grid;
        grid-template-columns: 1fr 120px;
        align-items: center;
        gap: 8px;
      }

      .discount label {
        font-weight: 600;
      }

      .hint {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
      }

      .hint.error {
        color: var(--danger);
      }

      .totals {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px;
        margin: 0;
      }

      .totals dt {
        color: var(--muted);
      }

      .totals dd {
        margin: 0;
        text-align: right;
      }

      .totals .grand {
        font: 700 22px var(--font-display);
        color: var(--ink);
        padding-top: 6px;
      }

      .notice {
        padding: 10px 12px;
        border-radius: var(--radius-s);
        font-size: 14px;
        margin: 0;
      }

      .notice.info {
        background: var(--accent-soft);
      }

      .notice.error {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .notice a {
        color: inherit;
        font-weight: 700;
      }

      .changes {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }

      .changes li {
        padding: 10px 12px;
        border-radius: var(--radius-s);
        background: var(--flag-soft);
      }

      .changes li.gone {
        background: var(--danger-soft);
      }

      .changes strong {
        display: block;
      }

      .dialog-form {
        display: grid;
        gap: 14px;
      }

      .dialog-form label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }

      .cart-bar {
        display: none;
      }

      @media (max-width: 960px) {
        .menu-layout {
          grid-template-columns: 1fr;
          padding: 0 16px 120px;
        }

        .cart {
          position: static;
          max-height: none;
        }

        .cart-bar {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 30;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding: 12px 16px;
          background: var(--surface);
          border-top: 1px solid var(--line);
        }

        .row {
          grid-template-columns: minmax(0, 1fr) auto;
          grid-template-rows: auto auto;
          gap: 0 12px;
        }

        .row-main {
          grid-row: 1 / 3;
        }

        .row-price {
          font-size: 14px;
        }

        .row-action .btn,
        .row-action .stepper {
          height: 30px;
        }
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <a class="brand" href="menu.html">My Kitchen</a>
      <nav class="nav">
        <a href="menu.html" aria-current="page">Menu</a>
        <a href="orders.html">Orders</a>
        <a href="admin.html">Menu setup</a>
      </nav>
      <span class="live" data-conn-indicator data-state="online"><span>Live</span></span>
    </header>
    <div class="conn-banner" data-conn-banner role="status" hidden></div>

    <main class="menu-layout">
      <section aria-label="Menu">
        <div class="menu-tools">
          <input class="field" type="search" id="search" autocomplete="off" />
          <nav class="chips" id="chips" aria-label="Categories"></nav>
        </div>
        <div id="menu-list"></div>
      </section>

      <aside class="cart" id="cart" aria-labelledby="cart-title">
        <div class="cart-head"><h2 id="cart-title">Your order</h2></div>
        <ul class="cart-lines" id="cart-lines"></ul>
        <p class="cart-empty" id="cart-empty">Nothing here yet. Add dishes from the menu.</p>
        <div class="cart-foot" id="cart-foot">
          <div class="discount">
            <label for="discount">Discount</label>
            <span class="money-field"
              ><input class="field" id="discount" inputmode="decimal" placeholder="0.00"
            /></span>
          </div>
          <p class="hint" id="discount-hint" hidden></p>
          <dl class="totals">
            <dt>Subtotal</dt>
            <dd id="subtotal"></dd>
            <dt>Discount</dt>
            <dd id="discount-applied"></dd>
            <dt class="grand">Total</dt>
            <dd class="grand" id="total"></dd>
          </dl>
          <p class="notice" id="checkout-notice" role="status" hidden></p>
          <button class="btn btn-primary btn-block" id="place-order" type="button">
            Place order
          </button>
        </div>
        <p class="notice info" id="placed" role="status" hidden style="margin: 0 20px 20px"></p>
      </aside>
    </main>

    <div class="cart-bar">
      <span id="cart-bar-text"></span>
      <a class="btn btn-primary" href="#cart">View order</a>
    </div>

    <dialog id="price-dialog">
      <form class="dialog-form" method="dialog" id="price-form">
        <div>
          <h2 id="price-title"></h2>
          <p id="price-desc"></p>
        </div>
        <p class="notice" id="price-notice" role="status" hidden></p>
        <label id="price-field"
          >Price for this order
          <span class="money-field"
            ><input class="field" id="price-input" inputmode="decimal" required
          /></span>
        </label>
        <label
          >Quantity
          <input class="field" id="qty-input" type="number" min="1" max="99" value="1" required />
        </label>
        <p class="hint error" id="price-error" hidden></p>
        <div class="dialog-actions">
          <button class="btn" value="cancel" formnovalidate>Cancel</button>
          <button class="btn btn-primary" value="add" id="price-submit">Add to order</button>
        </div>
      </form>
    </dialog>

    <dialog id="changes-dialog" aria-labelledby="changes-title">
      <h2 id="changes-title">The menu changed while you were ordering</h2>
      <p>We updated your order to match the kitchen. Nothing has been placed yet.</p>
      <ul class="changes" id="changes-list"></ul>
      <div class="dialog-actions">
        <button class="btn" type="button" id="changes-review">Review order</button>
        <button class="btn btn-primary" type="button" id="changes-confirm">
          Place updated order
        </button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status"></div>

    <script src="../shared/lab.js"></script>
    <script src="../shared/menu.js"></script>
  </body>
</html>
