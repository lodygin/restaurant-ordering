<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orders · My Kitchen (mockup)</title>
    <link rel="stylesheet" href="custom.css" />
    <link rel="stylesheet" href="../shared/lab-panel.css" />
    <style>
      .page {
        max-width: 1240px;
        margin: 0 auto;
        padding: 28px 24px 80px;
      }

      .page-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      .page-head h1 {
        font-size: 34px;
        letter-spacing: -0.02em;
      }

      .page-head p {
        margin: 0;
        color: var(--muted);
      }

      .rail {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        align-items: start;
        gap: 24px;
      }

      /* Kitchen ticket: receipt paper with a torn bottom edge. */
      .ticket {
        --tooth: 10px;
        position: relative;
        padding: 18px 18px 28px;
        background: var(--surface);
        font: 400 13px/1.5 var(--font-ticket);
        filter: drop-shadow(0 2px 3px rgb(36 20 26 / 12%));
        mask:
          conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% /
            var(--tooth) 100%,
          linear-gradient(#000 0 0) top / 100% calc(100% - var(--tooth) / 2) no-repeat;
        mask-composite: add;
      }

      .ticket[data-done] {
        opacity: 0.6;
      }

      .ticket-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding-bottom: 12px;
        border-bottom: 1px dashed var(--muted);
      }

      .ticket-number {
        display: block;
        font: 700 26px/1 var(--font-display);
        font-variant-numeric: tabular-nums;
      }

      .ticket-time {
        color: var(--muted);
      }

      .stamp {
        flex: none;
        padding: 2px 10px;
        border: 2.5px solid currentColor;
        border-radius: 4px;
        font: 700 17px/1.3 var(--font-display);
        transform: rotate(-6deg);
        color: var(--muted);
        background: rgb(255 255 255 / 85%);
      }

      .stamp[data-status='1'] {
        color: var(--flag);
      }

      .stamp[data-status='2'] {
        color: var(--accent);
      }

      /* Only a status that just changed gets stamped again; re-renders stay still. */
      .stamp[data-fresh] {
        animation: stamp 0.35s ease-out;
      }

      @keyframes stamp {
        from {
          transform: rotate(-6deg) scale(1.6);
          opacity: 0;
        }
      }

      .ticket-lines {
        list-style: none;
        margin: 12px 0;
        padding: 0;
      }

      .ticket-lines li {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 6px;
      }

      .ticket-sums {
        display: grid;
        grid-template-columns: 1fr auto;
        margin: 0;
        padding-top: 10px;
        border-top: 1px dashed var(--muted);
      }

      .ticket-sums dd {
        margin: 0;
        text-align: right;
      }

      .ticket-sums .grand {
        font-weight: 600;
        font-size: 15px;
      }

      .progress {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
        font: 500 11px var(--font-body);
        color: var(--muted);
      }

      .progress li {
        padding-top: 6px;
        border-top: 3px solid var(--line);
      }

      .progress li[data-reached] {
        border-top-color: var(--accent);
        color: var(--ink);
      }

      .empty {
        padding: 64px 0;
        text-align: center;
        color: var(--muted);
      }

      .empty a {
        color: var(--accent);
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <a class="brand" href="menu.html">My Kitchen</a>
      <nav class="nav">
        <a href="menu.html">Menu</a>
        <a href="orders.html" aria-current="page">Orders</a>
        <a href="admin.html">Menu setup</a>
      </nav>
      <span class="live" data-conn-indicator data-state="online"><span>Live</span></span>
    </header>
    <div class="conn-banner" data-conn-banner role="status" hidden></div>

    <main class="page">
      <div class="page-head">
        <h1>Your orders</h1>
        <p id="summary"></p>
      </div>
      <div class="rail" id="rail" aria-live="polite"></div>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script src="../shared/lab.js"></script>
    <script src="../shared/orders.js"></script>
  </body>
</html>
