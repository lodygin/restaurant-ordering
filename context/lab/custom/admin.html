<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menu setup · My Kitchen (mockup)</title>
    <link rel="stylesheet" href="custom.css" />
    <link rel="stylesheet" href="../shared/lab-panel.css" />
    <style>
      .setup {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 24px;
        max-width: 1240px;
        margin: 0 auto;
        padding: 28px 24px 80px;
      }

      .side {
        position: sticky;
        top: 84px;
        align-self: start;
        display: grid;
        gap: 12px;
      }

      .side h1 {
        font-size: 28px;
        letter-spacing: -0.02em;
      }

      .side p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .categories {
        list-style: none;
        margin: 0;
        padding: 6px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-m);
        max-height: calc(100vh - 330px);
        overflow-y: auto;
      }

      .categories button {
        display: flex;
        justify-content: space-between;
        width: 100%;
        padding: 8px 10px;
        border: 0;
        border-radius: var(--radius-s);
        background: none;
        text-align: left;
        cursor: pointer;
      }

      .categories button:hover {
        background: var(--bg);
      }

      .categories button[aria-current='true'] {
        background: var(--accent-soft);
        font-weight: 700;
      }

      .categories small {
        color: var(--muted);
      }

      .add-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-m);
      }

      .panel-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
      }

      .panel-head .field {
        flex: 1;
        height: 42px;
        font: 700 20px var(--font-display);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        text-align: left;
        border-bottom: 1px solid var(--line);
      }

      td {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      td .field {
        width: 100%;
      }

      .col-price {
        width: 140px;
      }

      .col-toggle {
        width: 104px;
        text-align: center;
      }

      .col-remove {
        width: 88px;
        text-align: right;
      }

      tr.changed td {
        animation: changed 2.4s ease-out;
      }

      @keyframes changed {
        0%,
        40% {
          background: var(--flag-soft);
        }
        100% {
          background: var(--surface);
        }
      }

      /* Availability switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 24px;
      }

      .switch input {
        position: absolute;
        inset: 0;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }

      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--line);
        transition: background 0.15s;
        pointer-events: none;
      }

      .switch span::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }

      .switch input:checked + span {
        background: var(--accent);
      }

      .switch input:checked + span::after {
        transform: translateX(16px);
      }

      .switch input:focus-visible + span {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .panel-foot {
        padding: 12px 20px;
        font-size: 13px;
        color: var(--muted);
        border-top: 1px solid var(--line);
      }

      .empty {
        padding: 32px 20px;
        color: var(--muted);
      }

      @media (max-width: 860px) {
        .setup {
          grid-template-columns: 1fr;
          padding: 20px 16px 120px;
        }

        .side {
          position: static;
        }

        .categories {
          max-height: 220px;
        }

        .panel {
          overflow-x: auto;
        }

        table {
          min-width: 620px;
        }
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <a class="brand" href="menu.html">My Kitchen</a>
      <nav class="nav">
        <a href="menu.html">Menu</a>
        <a href="orders.html">Orders</a>
        <a href="admin.html" aria-current="page">Menu setup</a>
      </nav>
      <span class="live" data-conn-indicator data-state="online"><span>Live</span></span>
    </header>
    <div class="conn-banner" data-conn-banner role="status" hidden></div>

    <main class="setup">
      <aside class="side">
        <h1>Menu setup</h1>
        <p>Changes go live on the menu as soon as you make them.</p>
        <ul class="categories" id="categories"></ul>
        <form class="add-row" id="add-category">
          <input
            class="field"
            name="name"
            placeholder="New category"
            aria-label="New category name"
          />
          <button class="btn" type="submit">Add</button>
        </form>
      </aside>

      <section class="panel" aria-labelledby="category-name">
        <div class="panel-head">
          <input class="field" id="category-name" aria-label="Category name" />
          <button class="btn" type="button" id="add-item">Add item</button>
          <button class="btn btn-quiet" type="button" id="delete-category">Delete category</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th class="col-price">Price</th>
              <th class="col-toggle">Available</th>
              <th class="col-toggle">Open price</th>
              <th class="col-remove"><span class="visually-hidden">Remove</span></th>
            </tr>
          </thead>
          <tbody id="items"></tbody>
        </table>
        <p class="empty" id="items-empty" hidden>
          No items in this category yet. Add the first one.
        </p>
        <div class="panel-foot" id="revision"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script src="../shared/lab.js"></script>
    <script src="../shared/admin.js"></script>
  </body>
</html>
