<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orders · My Kitchen (Material mockup)</title>
    <link rel="stylesheet" href="material.css" />
    <link rel="stylesheet" href="../shared/lab-panel.css" />
    <style>
      .page {
        max-width: 1240px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }

      .page-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      .page-head h1 {
        font-size: 32px;
        line-height: 40px;
      }

      .page-head p {
        margin: 0;
        color: var(--mat-sys-on-surface-variant);
      }

      .rail {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        align-items: start;
        gap: 16px;
      }

      /* Each order is an outlined mat-card. */
      .ticket {
        padding: 16px;
        background: var(--mat-sys-surface-container-lowest);
        border: 1px solid var(--mat-sys-outline-variant);
        border-radius: var(--mat-sys-corner-medium);
      }

      .ticket[data-done] {
        background: var(--mat-sys-surface-container-low);
      }

      .ticket-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .ticket-number {
        display: block;
        font-size: 22px;
        line-height: 28px;
      }

      .ticket-time {
        color: var(--mat-sys-on-surface-variant);
      }

      /* Status: a mat-chip coloured by state. */
      .stamp {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px 0 8px;
        border-radius: var(--mat-sys-corner-small);
        background: var(--mat-sys-surface-container-highest);
        font-weight: 500;
        color: var(--mat-sys-on-surface-variant);
      }

      .stamp::before {
        font-family: 'Material Symbols Outlined';
        font-size: 18px;
        content: 'receipt_long';
      }

      .stamp[data-status='1'] {
        background: var(--mat-sys-tertiary-container);
        color: var(--mat-sys-on-tertiary-container);
      }

      .stamp[data-status='1']::before {
        content: 'skillet';
      }

      .stamp[data-status='2'] {
        background: var(--mat-sys-primary-container);
        color: var(--mat-sys-on-primary-container);
      }

      .stamp[data-status='2']::before {
        content: 'notifications_active';
      }

      .stamp[data-status='3']::before {
        content: 'check_circle';
      }

      .stamp[data-fresh] {
        animation: pulse 0.6s ease-out;
      }

      @keyframes pulse {
        from {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--mat-sys-primary) 45%, transparent);
        }
        to {
          box-shadow: 0 0 0 10px transparent;
        }
      }

      .ticket-lines {
        list-style: none;
        margin: 16px 0 0;
        padding: 0;
        border-top: 1px solid var(--mat-sys-outline-variant);
      }

      .ticket-lines li {
        display: grid;
        grid-template-columns: 32px 1fr auto;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid var(--mat-sys-surface-container-high);
      }

      .ticket-lines li span:first-child {
        color: var(--mat-sys-on-surface-variant);
      }

      .ticket-sums {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px;
        margin: 12px 0 0;
      }

      .ticket-sums dt {
        color: var(--mat-sys-on-surface-variant);
      }

      .ticket-sums dd {
        margin: 0;
        text-align: right;
      }

      .ticket-sums .grand {
        font-size: 16px;
        font-weight: 500;
        color: var(--mat-sys-on-surface);
      }

      /* Horizontal mat-stepper, read-only. */
      .progress {
        counter-reset: step;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        margin: 20px 0 0;
        padding: 0;
        list-style: none;
        font-size: 12px;
        color: var(--mat-sys-on-surface-variant);
      }

      .progress li {
        counter-increment: step;
        position: relative;
        display: grid;
        justify-items: center;
        gap: 6px;
        text-align: center;
      }

      .progress li::before {
        content: counter(step);
        z-index: 1;
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--mat-sys-surface-container-highest);
        font-weight: 500;
      }

      .progress li + li::after {
        content: '';
        position: absolute;
        top: 12px;
        right: 50%;
        width: 100%;
        height: 1px;
        background: var(--mat-sys-outline-variant);
      }

      .progress li[data-reached] {
        color: var(--mat-sys-on-surface);
        font-weight: 500;
      }

      .progress li[data-reached]::before {
        content: 'check';
        font-family: 'Material Symbols Outlined';
        font-size: 16px;
        background: var(--mat-sys-primary);
        color: var(--mat-sys-on-primary);
      }

      .progress li[data-reached] + li[data-reached]::after {
        background: var(--mat-sys-primary);
      }

      .empty {
        padding: 64px 0;
        text-align: center;
        color: var(--mat-sys-on-surface-variant);
      }

      .empty a {
        color: var(--mat-sys-primary);
        font-weight: 500;
      }
    </style>
  </head>

  <body>
    <header class="toolbar">
      <a class="toolbar-title" href="menu.html"
        ><span class="icon" aria-hidden="true">restaurant</span><span>My Kitchen</span></a
      >
      <nav class="tab-nav">
        <a href="menu.html">Menu</a>
        <a href="orders.html" aria-current="page">Orders</a>
        <a href="admin.html">Menu setup</a>
      </nav>
      <span class="live" data-conn-indicator data-state="online"><span>Live</span></span>
    </header>
    <div class="conn-banner" data-conn-banner role="status" hidden></div>

    <main class="page">
      <div class="page-head">
        <h1>Your orders</h1>
        <p id="summary"></p>
      </div>
      <div class="rail" id="rail" aria-live="polite"></div>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script src="../shared/lab.js"></script>
    <script src="../shared/orders.js"></script>
  </body>
</html>
